<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <div class="login-wrapper">

    <!-- LOGIN -->
    <div class="login-card">

      <div class="logo-circle">
        <div class="logo-symbol">⌂</div>
        <span>YOUR LOGO</span>
      </div>

      <form id="loginForm">

        <div class="input-box">
          <span class="input-icon">👤</span>

          <input
            type="email"
            id="email"
            placeholder="EMAIL"
            required
          >
        </div>

        <div class="input-box">
          <span class="input-icon">🔒</span>

          <input
            type="password"
            id="password"
            placeholder="PASSWORD"
            required
          >
        </div>

        <div class="remember-box">
          <input type="checkbox" id="remember">

          <label for="remember">
            Remember Me ?
          </label>
        </div>

        <button type="submit" class="login-button">
          LOG IN
        </button>

        <p id="message"></p>

      </form>

      <p class="register-text">
        Don't have an account?
        <a href="#" id="showRegister">REGISTER HERE</a>
      </p>

    </div>


    <!-- REGISTER -->
    <div class="register-card hidden">

      <h2>CREATE ACCOUNT</h2>

      <form id="registerForm">

        <div class="input-box">
          <span class="input-icon">👤</span>

          <input
            type="text"
            id="name"
            placeholder="NAME"
            required
          >
        </div>

        <div class="input-box">
          <span class="input-icon">✉</span>

          <input
            type="email"
            id="regEmail"
            placeholder="EMAIL"
            required
          >
        </div>

        <div class="input-box">
          <span class="input-icon">🔒</span>

          <input
            type="password"
            id="regPassword"
            placeholder="PASSWORD"
            required
          >
        </div>

        <button type="submit" class="login-button">
          REGISTER
        </button>

        <p id="registerMessage"></p>

      </form>

      <p class="register-text">
        Already have an account?
        <a href="#" id="showLogin">LOGIN HERE</a>
      </p>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
